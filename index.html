<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EX TRADER - MOBILE SIGNAL BOT</title>
<style>
body{margin:0;padding:10px;font-family:monospace;background: linear-gradient(135deg,#0f172a,#1e293b,#0f172a);color:white;text-align:center;}
.card{background: rgba(30,41,59,0.95);padding:15px;border-radius:15px;margin:15px auto;box-shadow:0 0 20px rgba(56,189,248,0.5);width:95%;max-width:400px;}
button, select{width:90%;padding:10px;margin:5px 0;border:none;border-radius:6px;font-weight:bold;cursor:pointer;}
button{ background:#38bdf8; color:black; }
#signals{margin-top:15px;background:#0f172a;padding:10px;border-radius:10px;white-space: pre-line;max-height:250px;overflow-y:auto;text-align:left;}
table{width:100%;border-collapse: collapse;margin-top:10px;font-size:12px;}
th,td{border:1px solid #334155;padding:4px;}
th{background:#1e293b;}
td{background:#0f172a;}
.lock{color:#ff4444;}
</style>
</head>
<body>

<div class="card" id="optionBox">
<h2>EX TRADER PREMIUM</h2>
<p>Select Option</p>
<button onclick="freeOption()">1️⃣ Free Trial (3 signals only)</button>
<button onclick="premiumOption()">2️⃣ Premium PIN (Unlimited)</button>
<p id="msg"></p>
<button onclick="resetTrial()">Reset Trial (Only 1 time)</button>
</div>

<div class="card" id="appBox" style="display:none;">
<h3 id="title">Signal Generator</h3>

<select id="pair">
<option>EUR/USD (OTC)</option>
<option>GBP/USD (OTC)</option>
<option>USD/JPY (OTC)</option>
<option>AUD/USD (OTC)</option>
<option>USD/CAD (OTC)</option>
<option>USD/INR (OTC)</option>
<option>USD/PHP (OTC)</option>
<option>USD/ARS (OTC)</option>
<option>USD/TRY (OTC)</option>
<option>CAD/CHF (OTC)</option>
<option>USD/INR (OTC)</option>

<option>EUR/USD</option>
<option>GBP/USD</option>
<option>USD/JPY</option>
<option>AUD/USD</option>
<option>USD/CAD</option>
<option>USD/CHF</option>
<option>NZD/USD</option>

</select>

<select id="count">
<option value="3">3 Signals</option>
<option value="5">5 Signals</option>
<option value="10">10 Signals</option>
<option value="20">20 Signals</option>
<option value="30">30 Signals</option>
</select>

<button onclick="generateSignals()">Generate Signals</button>

<div id="signals"></div>

<h4>Signal History</h4>
<table>
<thead>
<tr><th>#</th><th>Time</th><th>Pair</th><th>Direction</th></tr>
</thead>
<tbody id="history"></tbody>
</table>
</div>

<script>
let trialUsed = localStorage.getItem("trialUsed") || "no";
let resetUsed = localStorage.getItem("resetUsed") || "no";
let premiumUnlocked = false;
const PREMIUM_PIN = "9696"; // change PIN

function freeOption(){
    if(trialUsed === "yes"){
        document.getElementById("msg").innerHTML="<span class='lock'>Trial already used!</span>";
        return;
    }
    localStorage.setItem("trialUsed","yes");
    trialUsed = "yes";
    premiumUnlocked = false;
    document.getElementById("optionBox").style.display="none";
    document.getElementById("appBox").style.display="block";
    document.getElementById("title").innerText="Free Trial (Max 3 Signals)";
    document.getElementById("count").value="3";
}

function premiumOption(){
    let pin = prompt("Enter Premium PIN:");
    if(pin === PREMIUM_PIN){
        premiumUnlocked = true;
        document.getElementById("optionBox").style.display="none";
        document.getElementById("appBox").style.display="block";
        document.getElementById("title").innerText="Premium Signals - Unlimited";
    } else {
        alert("Wrong PIN! Access denied.");
    }
}

function resetTrial(){
    if(resetUsed === "yes"){
        alert("You can only reset trial once! No more resets allowed.");
        return;
    }
    if(trialUsed === "yes"){
        localStorage.setItem("trialUsed","no");
        localStorage.setItem("resetUsed","yes");
        trialUsed = "no";
        resetUsed = "yes";
        alert("Trial Reset! You can now try Free Trial again. (Only 1 time allowed)");
        location.reload();
    } else {
        alert("Trial not used yet, no need to reset.");
    }
}

function randomDirection(){
    return Math.random() < 0.5 ? "PUT" : "BUY";
}

function formatTime(date){
    let h = date.getHours().toString().padStart(2,'0');
    let m = date.getMinutes().toString().padStart(2,'0');
    return h + ":" + m;
}

function generateSignals(){
    let pair = document.getElementById("pair").value;
    let count = parseInt(document.getElementById("count").value);

    if(!premiumUnlocked && count > 3){
        alert("Free Trial can generate only 3 signals!");
        count = 3;
        document.getElementById("count").value="3";
    }

    let now = new Date();
    let output="";
    let history = document.getElementById("history");
    history.innerHTML="";

    for(let i=0;i<count;i++){
        let future = new Date(now.getTime() + (i*3*60000));
        let direction = randomDirection();
        output += "☑ M1-"+formatTime(future)+"-"+pair+"-"+direction+"\n";

        let row = `<tr>
        <td>${i+1}</td>
        <td>${formatTime(future)}</td>
        <td>${pair}</td>
        <td>${direction}</td>
        </tr>`;
        history.innerHTML += row;
    }

    document.getElementById("signals").innerText=output;
}
</script>

</body>
</html>
