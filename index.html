<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EX TRADER NON MTG BOT</title>

<style>
body{
  margin:0;
  background:#0d0d1f;
  font-family:Arial;
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

.card{
  background:#151530;
  padding:25px;
  width:90%;
  max-width:400px;
  border-radius:20px;
  box-shadow:0 0 25px #00ff88;
}

h1{
  text-align:center;
  color:#00ff88;
  text-shadow:0 0 15px #00ff88;
}

label{
  margin-top:10px;
  display:block;
}

select,input{
  width:100%;
  padding:10px;
  margin-top:5px;
  margin-bottom:15px;
  background:#0f0f1a;
  color:white;
  border:1px solid #00ff88;
  border-radius:10px;
}

button{
  width:100%;
  padding:12px;
  background:#00ff00;
  border:none;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
  box-shadow:0 0 15px #00ff00;
}

.result{
  margin-top:20px;
  padding:15px;
  border-radius:10px;
  text-align:center;
  font-size:18px;
}

.up{
  background:#002200;
  color:#00ff00;
  box-shadow:0 0 20px #00ff00;
}

.down{
  background:#220000;
  color:red;
  box-shadow:0 0 20px red;
}

.hidden{
  display:none;
}
</style>
</head>

<body>

<div class="card" id="pinCard">
<h1>ENTER PIN</h1>
<input type="password" id="pinInput" placeholder="Enter PIN Code">
<button onclick="checkPin()">UNLOCK</button>
<p id="pinError" style="color:red;"></p>
</div>

<div class="card hidden" id="mainBot">

<h1>EX TRADER NON MTG BOT</h1>

<label>Broker</label>
<select id="broker">
<option>QUOTEX</option>
<option>POCKET OPTION</option>
<option>IQ OPTION</option>
<option>BINOMO</option>
<option>EXPERT OPTION</option>
<option>OLYMP TRADE</option>
</select>

<label>Market</label>
<select id="market">
<option>EUR/USD</option>
<option>GBP/USD</option>
<option>USD/JPY</option>
<option>AUD/USD</option>
<option>USD/CHF</option>
<option>USD/CAD</option>
<option>NZD/USD</option>

<!-- Cross -->
<option>EUR/GBP</option>
<option>EUR/JPY</option>
<option>EUR/AUD</option>
<option>EUR/CHF</option>
<option>GBP/JPY</option>
<option>GBP/AUD</option>
<option>AUD/JPY</option>

<option>EUR/USD (OTC)</option>
<option>GBP/USD (OTC)</option>
<option>USD/JPY (OTC)</option>
<option>AUD/USD (OTC)</option>
<option>USD/CAD (OTC)</option>
<option>USD/CHF (OTC)</option>
<option>NZD/USD (OTC)</option>

<option>EUR/GBP (OTC)</option>
<option>EUR/JPY (OTC)</option>
<option>EUR/AUD (OTC)</option>
<option>EUR/CHF (OTC)</option>

<option>GBP/JPY (OTC)</option>
<option>GBP/AUD (OTC)</option>
<option>GBP/CHF (OTC)</option>

<option>AUD/JPY (OTC)</option>
<option>AUD/CAD (OTC)</option>

<option>NZD/JPY (OTC)</option>

<option>USD/TRY (OTC)</option>
<option>USD/ZAR (OTC)</option>

<option>BTC/USD (OTC)</option>
<option>ETH/USD (OTC)</option>
<option>LTC/USD (OTC)</option>
<option>XRP/USD (OTC)</option>

</select>

<label>Timeframe</label>
<select id="timeframe">
<option>M1</option>
<option>M5</option>
<option>M15</option>
</select>

<label>Start Time</label>
<input type="time" id="time">

<button onclick="generateSignal()">GENERATE SIGNAL</button>

<div id="output"></div>

</div>

<script>

// 🔐 এখানে PIN সেট করো
let correctPin = "8080";

function checkPin(){
let userPin = document.getElementById("pinInput").value;

if(userPin === correctPin){
document.getElementById("pinCard").classList.add("hidden");
document.getElementById("mainBot").classList.remove("hidden");
}else{
document.getElementById("pinError").innerText = "Wrong PIN!";
}
}

function generateSignal(){

  let broker = document.getElementById("broker").value;
  let market = document.getElementById("market").value;
  let timeframe = document.getElementById("timeframe").value;
  let time = document.getElementById("time").value;

  let direction = Math.random() > 0.5 ? "UP" : "DOWN";

  let outputDiv = document.getElementById("output");

  if(direction === "UP"){
    outputDiv.className = "result up";
  } else {
    outputDiv.className = "result down";
  }

  outputDiv.innerHTML = `
  <b>PREDICTION RESULT</b><br><br>
  Broker: ${broker} <br>
  Market: ${market} <br>
  Timeframe: ${timeframe} <br>
  Start Time: ${time} <br><br>
  <h2>${direction}</h2>
  `;
}

</script>

</body>
</html>
